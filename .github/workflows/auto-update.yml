name: 自动下载词典 → 运行脚本 → 提交结果

on:
  schedule:
    - cron: '0 22,4,10,16 * * *' # UTC 22/04/10/16 = 北京时间 06/12/18/00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 下载并解压万象词库
        run: |
          mkdir -p input_dicts tmp_extract

          # 1. 下载万象词库压缩包（-f 让 HTTP 404 等错误直接失败）
          curl -fL "https://github.com/amzxyz/rime-wanxiang-data/releases/download/dict-nightly/dicts.zip" \
            -o dicts.zip

          # 2. 解压到临时目录（压缩包内为 dicts/ 目录）
          unzip -q dicts.zip -d tmp_extract

          # 3. 展平：压缩包内的所有词库文件统一移入 input_dicts
          find tmp_extract -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.txt" \) \
            -exec mv -v {} input_dicts/ \;

          # 4. 清理临时文件
          rm -rf tmp_extract dicts.zip

          echo "input_dicts 中共有 $(ls input_dicts | wc -l) 个词库文件待处理"

      - name: 刷辅助码
        run: python aux_go.py

      - name: 提交输出文件到仓库
        env:
          GIT_AUTHOR_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci-bot
          GIT_COMMITTER_EMAIL: ci-bot@example.com
        run: |
          # 用本次输出完整替换 dicts-pro/，避免保留旧词库源的文件
          rm -rf dicts-pro
          mkdir -p dicts-pro
          cp -rf output_dicts/dicts-pro/* dicts-pro/

          git add .
          if git diff --staged --quiet; then
            echo "☕ 上游词库完全一致，没有检测到任何新更新，跳过本次提交。"
          else
            echo "🚀 检测到词库更新，开始提交变动..."
            git commit -m "自动更新处理后词库 [ci skip]"
            git push
          fi

      - name: 更新 latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          TAG="latest"
          ASSET="dicts-pro.zip"
          NOTES="自动更新自 amzxyz/rime-wanxiang-data dict-nightly。提交：${SHA}。运行时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          zip -r "$ASSET" dicts-pro

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "词库最新版" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$ASSET" \
              --target "$SHA" \
              --title "词库最新版" \
              --notes "$NOTES" \
              --latest
          fi
